<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Way 2</title>

<style>
/* ===== COLORS (BLUE FIXED) ===== */
:root{
  --bg:#0b1f33;
  --main:#2196f3;
  --card:#ffffff;
  --text:#ffffff;
  --cardText:#000000;
}

/* ===== BASE ===== */
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== HEADER ===== */
.header{
  background:var(--main);
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

/* ===== CLOCK ===== */
.clock{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:15px 0;
}
.subclock{font-size:14px;opacity:.8}

/* ===== HOME ===== */
.container{
  padding:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:var(--card);
  color:var(--cardText);
  border-radius:20px;
  padding:30px 10px;
  text-align:center;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.wide{grid-column:1 / span 2}

/* ===== BUTTON ===== */
button{
  background:var(--main);
  color:white;
  border:none;
  border-radius:14px;
  padding:12px 20px;
  font-size:16px;
  box-shadow:0 6px 15px rgba(0,0,0,.25);
}

/* ===== SNOW ===== */
.snowflake{
  position:fixed;
  top:-20px;
  color:#cce9ff;
  pointer-events:none;
  z-index:9999;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="header">
  <span></span>
  <span>Study Way 2</span>
  <span></span>
</div>

<div class="clock" id="clock">
  00:00:00
  <div class="subclock" id="date"></div>
</div>

<div class="container">
  <div class="card">💻 التخطيط</div>
  <div class="card">📱 التنفيذ</div>
  <div class="card wide">📚 الملخصات</div>
  <div class="card wide">⚔️ تحدي الفصل</div>
</div>

<script>
/* ===== CLOCK ===== */
function updateClock(){
  const n=new Date();
  clock.textContent=n.toLocaleTimeString();
  date.textContent=n.toLocaleDateString("ar-DZ");
}
setInterval(updateClock,1000);
updateClock();

/* ===== SNOW EFFECT (LIKE IMAGE) ===== */
function makeSnow(){
  const s=document.createElement("div");
  s.className="snowflake";
  s.innerHTML="❄";
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=10+Math.random()*16+"px";
  s.style.opacity=Math.random();
  s.style.animationDuration=6+Math.random()*6+"s";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),12000);
}

setInterval(makeSnow,300);
</script>

</body>
    </html>
