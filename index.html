<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-version" content="1.0.2">
<title>Study Way 2</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f33">

<style>
:root{
  --bg:#0b1f33;
  --card:#ffffff;
  --main:#0a58ca;
  --text:#ffffff;
}
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

/* ===== الأساس ===== */
.header{
  background:var(--main);
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}
.title{font-size:18px}
.clock{text-align:center;font-size:28px;margin:15px 0}
.subclock{font-size:14px;opacity:.8}
.container{
  padding:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.card{
  background:var(--card);
  color:#000;
  border-radius:16px;
  padding:30px 10px;
  text-align:center;
  cursor:pointer;
}
.page{display:none;padding:15px}
textarea,input,button,select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}
button{background:var(--main);color:white;border:none}
.item{
  background:#fff;color:#000;padding:10px;margin-top:10px;
  border-radius:10px;position:relative;
  display: flex; justify-content: space-between; align-items: center;
}
.delete-btn{
  background:none; color:red; border:none; width:auto; margin:0; 
  cursor:pointer; font-size:18px;
}
.battle{
  background:linear-gradient(135deg,#ff5722,#ff9800);
  padding:20px;border-radius:18px;margin:15px;text-align:center;
}
.footer{text-align:center;padding:15px}

/* ===== رمضان ===== */
.ramadan-bg{
  background:linear-gradient(180deg,#fff8c4,#ffd54f);
}
.ramadan-bg::after{
  content:"☾";
  position:fixed;
  top:20px;
  right:20px;
  font-size:90px;
  color:rgba(255,193,7,.6);
  pointer-events:none;
}
.ramadan-btn{
  background:linear-gradient(135deg,#ffeb3b,#ffc107)!important;
  color:#3b2a00!important;
}
.lantern{
  position:fixed;
  top:-50px;
  font-size:26px;
  animation:fall 10s linear infinite;
  pointer-events:none;
}

/* ===== ثلج ===== */
.snowflake{
  position:fixed;
  top:-40px;
  font-size:20px;
  animation:fall 9s linear infinite;
  pointer-events:none;
  opacity:.9;
}

@keyframes fall{
  to{transform:translateY(110vh)}
}
.thanks-img {
  width: 100%;
  max-width: 300px;
  display: block;
  margin: 20px auto;
  border-radius: 10px;
}
</style>
</head>

<body onload="loadAll()">

<div class="header">
  <span onclick="home()">⬅️</span>
  <span class="title">📘 Study Way</span>
  <span onclick="settings()">⚙️</span>
</div>

<div class="clock" id="clock">
  00:00:00
  <div class="subclock" id="date"></div>
</div>

<div id="home" class="container">
  <div class="card" onclick="openProgram()">💻 التخطيط</div>
  <div class="card" onclick="openApp()">📱 التنفيذ</div>
  <div class="card" onclick="openSubjects()">📚 المواد</div>
</div>

<div class="battle">
  ⚔️ معركة الفصل
  <div id="countdown"></div>
</div>

<div id="program" class="page">
  <select id="planType">
    <option value="🌙 وقت النوم">🌙 وقت النوم</option>
    <option value="☀️ وقت الاستيقاظ">☀️ وقت الاستيقاظ</option>
    <option value="📖 وقت المراجعة">📖 وقت المراجعة</option>
    <option value="🎮 وقت اللعب">🎮 وقت اللعب</option>
  </select>
  <input type="time" id="planTime">
  <button onclick="addPlan()">إضافة</button>
  <div id="plans"></div>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_G976H7K2V_v-zYw4eS-6I1FhO7tXn6vF6w&s" alt="Thank you all" class="thanks-img">
</div>

<div id="app" class="page">
  <textarea id="doneText"></textarea>
  <button onclick="addDone()">حفظ</button>
  <div id="doneList"></div>
</div>

<div id="subjects" class="container page">
  <div class="card" onclick="openSubject('arabic')">📘 العربية</div>
  <div class="card" onclick="openSubject('math')">🧮 الرياضيات</div>
  <div class="card" onclick="openSubject('science')">🧪 العلوم</div>
  <div class="card" onclick="openSubject('physics')">⚡ الفيزياء</div>
  <div class="card" onclick="openSubject('history')">🏛️ التاريخ</div>
  <div class="card" onclick="openSubject('geo')">🌍 الجغرافيا</div>
</div>

<div id="lessons" class="page">
  <div id="lessonList" class="container"></div>
</div>

<div id="settings" class="page">
  <button onclick="saveTheme('fire', '#2b0b0b','#ff5722')">🔥 ناري</button>
  <button onclick="saveTheme('snow', '#0b1f33','#1e88e5')">❄️ ثلجي</button>
  <button onclick="saveTheme('gold', '#1c1c1c','#d4af37')">🟨 ذهبي</button>
  <button onclick="saveTheme('purple', '#2a1437','#8e24aa')">💜 بنفسجي</button>
  <button onclick="saveTheme('ramadan')">🌙 رمضان</button>
</div>

<script>
/* الصفحات */
const pages=["home","program","app","settings","subjects","lessons"];
function show(id){
  pages.forEach(p=>document.getElementById(p).style.display="none");
  document.getElementById(id).style.display=
    (id==="home"||id==="subjects")?"grid":"block";
}
function home(){show("home")}
function openProgram(){show("program")}
function openApp(){show("app")}
function settings(){show("settings")}
function openSubjects(){show("subjects")}

/* الساعة */
setInterval(()=>{
  const n=new Date();
  clock.childNodes[0].nodeValue = n.toLocaleTimeString();
  date.textContent=n.toLocaleDateString("ar-DZ");
},1000);

/* الحفظ */
function addPlan(){
  if(!planTime.value)return;
  const id = Date.now();
  plans.innerHTML+=`<div class="item" id="p${id}"><span>${planType.value}: ${planTime.value}</span><button class="delete-btn" onclick="removeItem('p${id}','plansData')">🗑️</button></div>`;
  saveData('plansData', plans.innerHTML);
}
function addDone(){
  if(!doneText.value)return;
  const id = Date.now();
  doneList.innerHTML+=`<div class="item" id="d${id}"><span>${doneText.value}</span><button class="delete-btn" onclick="removeItem('d${id}','doneData')">🗑️</button></div>`;
  saveData('doneData', doneList.innerHTML);
  doneText.value="";
}
function saveData(key, val) { localStorage.setItem(key, val); }
function removeItem(id, key) {
  document.getElementById(id).remove();
  saveData(key, document.getElementById(key === 'plansData' ? 'plans' : 'doneList').innerHTML);
}

function saveTheme(type, bg, main) {
  localStorage.setItem('themeType', type);
  if(type === 'ramadan') ramadanTheme();
  else if(type === 'snow') snowTheme();
  else theme(bg, main);
}

function loadAll() {
  if(localStorage.getItem('plansData')) plans.innerHTML = localStorage.getItem('plansData');
  if(localStorage.getItem('doneData')) doneList.innerHTML = localStorage.getItem('doneData');
  const savedTheme = localStorage.getItem('themeType');
  if(savedTheme === 'fire') theme('#2b0b0b','#ff5722');
  else if(savedTheme === 'snow') snowTheme();
  else if(savedTheme === 'gold') theme('#1c1c1c','#d4af37');
  else if(savedTheme === 'purple') theme('#2a1437','#8e24aa');
  else if(savedTheme === 'ramadan') ramadanTheme();
}

/* السمات */
let ramadanInterval = null;
function theme(bg,main){
  document.body.className="";
  document.documentElement.style.setProperty("--bg",bg);
  document.documentElement.style.setProperty("--main",main);
  document.querySelectorAll(".lantern,.snowflake").forEach(e=>e.remove());
  if(ramadanInterval) clearInterval(ramadanInterval);
}
function ramadanTheme(){
  theme("#fff8c4","#ffc107");
  document.body.classList.add("ramadan-bg");
  document.querySelectorAll("button").forEach(b=>b.classList.add("ramadan-btn"));
  if(ramadanInterval) clearInterval(ramadanInterval);
  ramadanInterval = setInterval(()=>{
    let l=document.createElement("div");
    l.className="lantern";
    l.textContent="🏮";
    l.style.left=Math.random()*100+"%";
    l.style.animationDuration=(6+Math.random()*6)+"s";
    document.body.appendChild(l);
    setTimeout(()=>l.remove(),12000);
  },1200);
}
function snowTheme(){
  theme("#0b1f33","#1e88e5");
  for(let i=0;i<15;i++){
    let s=document.createElement("div");
    s.className="snowflake";
    s.textContent="❄️";
    s.style.left=Math.random()*100+"%";
    s.style.animationDuration=6+Math.random()*6+"s";
    document.body.appendChild(s);
  }
}

/* ===== المواد + الدروس الأصلي ===== */
const subjects={
  arabic:["النصوص الأدبية","القواعد","الصرف","التعبير الكتابي","المحفوظات"],
  math:["الأعداد","المعادلات","الدوال","الإحصاء","الهندسة"],
  science:["التغذية","الهضم","التنفس","الدوران الدموي","الوراثة"],
  physics:["المادة","الكتلة والحجم","الكثافة","الكهرباء","الطاقة"],
  history:["الاحتلال","المقاومة","ثورة نوفمبر","مراحل الثورة","الاستقلال"],
  geo:["الموقع الجغرافي","السكان","الموارد","الفلاحة","الصناعة"]
};

function openSubject(name){
  show("lessons");
  lessonList.innerHTML="";
  subjects[name].forEach(d=>{
    lessonList.innerHTML+=`<div class="card" onclick="this.style.background='#ccc'">${d}</div>`;
  });
}
</script>

</body>
</html>
