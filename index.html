<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-version" content="1.0.2">
<title>Study Way 2 - Spring Edition</title>

<style>
:root{
  --bg:#0b1f33;
  --card:#ffffff;
  --main:#0a58ca;
  --text:#ffffff;
}
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x: hidden;
  transition: background 0.5s ease;
}

/* ===== الأساس ===== */
.header{
  background:var(--main);
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}
.title{font-size:18px}
.clock{text-align:center;font-size:28px;margin:15px 0}
.subclock{font-size:14px;opacity:.8}
.container{
  padding:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.card{
  background:var(--card);
  color:#000;
  border-radius:16px;
  padding:30px 10px;
  text-align:center;
  cursor:pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.page{display:none;padding:15px}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
button{background:var(--main);color:white;border:none;cursor:pointer;font-weight:bold}
.item{
  background:#fff;color:#000;padding:10px;margin-top:10px;
  border-radius:10px;position:relative;
  display: flex; justify-content: space-between; align-items: center;
}
.delete-btn{
  background:none; color:red; border:none; width:auto; margin:0; 
  cursor:pointer; font-size:18px;
}
.battle{
  background:linear-gradient(135deg,#ff5722,#ff9800);
  padding:20px;border-radius:18px;margin:15px;text-align:center;
}

/* ===== العناصر المتساقطة (ثلج، فانوس، ورد) ===== */
.falling-element {
  position: fixed;
  top: -50px;
  pointer-events: none;
  z-index: 9999;
  animation: fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg)}
}

/* ===== سمة الربيع ===== */
.spring-bg {
  background: linear-gradient(180deg, #e8f5e9, #c8e6c9) !important;
  color: #1b5e20 !important;
}

/* ===== صورة الشكر ===== */
.thanks-img {
  width: 100%;
  max-width: 300px;
  display: block;
  margin: 20px auto;
  border-radius: 10px;
}
</style>
</head>

<body onload="loadAll()">

<div class="header">
  <span onclick="home()" style="cursor:pointer">⬅️</span>
  <span class="title">📘 Study Way</span>
  <span onclick="settings()" style="cursor:pointer">⚙️</span>
</div>

<div class="clock" id="clock">
  00:00:00
  <div class="subclock" id="date"></div>
</div>

<div id="home" class="container">
  <div class="card" onclick="openProgram()">💻 التخطيط</div>
  <div class="card" onclick="openApp()">📱 التنفيذ</div>
  <div class="card" onclick="openSubjects()">📚 المواد</div>
</div>

<div class="battle">
  ⚔️ معركة الفصل
  <div id="countdown">الموسم الدراسي مستمر!</div>
</div>

<div id="program" class="page">
  <select id="planType">
    <option value="🌙 وقت النوم">🌙 وقت النوم</option>
    <option value="☀️ وقت الاستيقاظ">☀️ وقت الاستيقاظ</option>
    <option value="📖 وقت المراجعة">📖 وقت المراجعة</option>
    <option value="🎮 وقت اللعب">🎮 وقت اللعب</option>
  </select>
  <input type="time" id="planTime">
  <button onclick="addPlan()">إضافة للخطة</button>
  <div id="plans"></div>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_G976H7K2V_v-zYw4eS-6I1FhO7tXn6vF6w&s" alt="Thank you" class="thanks-img">
</div>

<div id="app" class="page">
  <textarea id="doneText" placeholder="ماذا أنجزت اليوم؟"></textarea>
  <button onclick="addDone()">حفظ الإنجاز</button>
  <div id="doneList"></div>
</div>

<div id="subjects" class="container page">
  <div class="card" onclick="openSubject('arabic')">📘 العربية</div>
  <div class="card" onclick="openSubject('math')">🧮 الرياضيات</div>
  <div class="card" onclick="openSubject('science')">🧪 العلوم</div>
  <div class="card" onclick="openSubject('physics')">⚡ الفيزياء</div>
  <div class="card" onclick="openSubject('history')">🏛️ التاريخ</div>
  <div class="card" onclick="openSubject('geo')">🌍 الجغرافيا</div>
</div>

<div id="lessons" class="page">
  <div id="lessonList" class="container"></div>
</div>

<div id="settings" class="page">
  <h3 style="text-align:center; color:inherit">اختر المظهر</h3>
  <button onclick="saveTheme('spring', '#e8f5e9','#2e7d32')" style="background:#4caf50">🌸 ربيعي (جديد)</button>
  <button onclick="saveTheme('fire', '#2b0b0b','#ff5722')" style="background:#ff5722">🔥 ناري</button>
  <button onclick="saveTheme('snow', '#0b1f33','#1e88e5')" style="background:#1e88e5">❄️ ثلجي</button>
  <button onclick="saveTheme('gold', '#1c1c1c','#d4af37')" style="background:#d4af37">🟨 ذهبي</button>
  <button onclick="saveTheme('purple', '#2a1437','#8e24aa')" style="background:#8e24aa">💜 بنفسجي</button>
  <button onclick="saveTheme('ramadan', '#fff8c4', '#ffc107')" style="background:#ffc107; color:#000">🌙 رمضان</button>
</div>

<script>
const pages=["home","program","app","settings","subjects","lessons"];
let activeInterval = null;

function show(id){
  pages.forEach(p=>document.getElementById(p).style.display="none");
  const el = document.getElementById(id);
  el.style.display = (id==="home"||id==="subjects"||id==="lessons") ? "grid" : "block";
}

function home(){show("home")}
function openProgram(){show("program")}
function openApp(){show("app")}
function settings(){show("settings")}
function openSubjects(){show("subjects")}

/* ساعة النظام */
setInterval(()=>{
  const n=new Date();
  document.getElementById('clock').childNodes[0].nodeValue = n.toLocaleTimeString("ar-DZ");
  document.getElementById('date').textContent = n.toLocaleDateString("ar-DZ", {weekday:'long', year:'numeric', month:'long', day:'numeric'});
},1000);

/* إدارة البيانات */
function addPlan(){
  if(!planTime.value) return;
  const id = Date.now();
  const html = `<div class="item" id="p${id}"><span>${planType.value}: ${planTime.value}</span><button class="delete-btn" onclick="removeItem('p${id}','plansData')">🗑️</button></div>`;
  document.getElementById('plans').innerHTML += html;
  saveData('plansData', document.getElementById('plans').innerHTML);
}

function addDone(){
  if(!doneText.value) return;
  const id = Date.now();
  const html = `<div class="item" id="d${id}"><span>${doneText.value}</span><button class="delete-btn" onclick="removeItem('d${id}','doneData')">🗑️</button></div>`;
  document.getElementById('doneList').innerHTML += html;
  saveData('doneData', document.getElementById('doneList').innerHTML);
  doneText.value="";
}

function saveData(key, val) { localStorage.setItem(key, val); }
function removeItem(id, key) {
  document.getElementById(id).remove();
  saveData(key, document.getElementById(key === 'plansData' ? 'plans' : 'doneList').innerHTML);
}

/* نظام السمات المحسن */
function clearEffects() {
  if(activeInterval) clearInterval(activeInterval);
  document.querySelectorAll(".falling-element").forEach(e=>e.remove());
  document.body.className = "";
  document.querySelectorAll("button").forEach(b=>b.style.filter = "none");
}

function theme(bg, main, textColor = "#ffffff") {
  clearEffects();
  document.documentElement.style.setProperty("--bg", bg);
  document.documentElement.style.setProperty("--main", main);
  document.body.style.color = textColor;
}

function createFallingItem(emoji, duration) {
  const item = document.createElement("div");
  item.className = "falling-element";
  item.textContent = emoji;
  item.style.left = Math.random() * 100 + "%";
  item.style.fontSize = (Math.random() * 20 + 15) + "px";
  item.style.animationDuration = duration + "s";
  document.body.appendChild(item);
  setTimeout(() => item.remove(), duration * 1000);
}

function springTheme() {
  theme("#e8f5e9", "#2e7d32", "#1b5e20");
  document.body.classList.add("spring-bg");
  const flowers = ["🌸", "🌼", "🌷", "🌹", "🍃"];
  activeInterval = setInterval(() => {
    createFallingItem(flowers[Math.floor(Math.random()*flowers.length)], Math.random()*5 + 5);
  }, 600);
}

function snowTheme() {
  theme("#0b1f33", "#1e88e5");
  activeInterval = setInterval(() => {
    createFallingItem("❄️", Math.random()*5 + 5);
  }, 400);
}

function ramadanTheme() {
  theme("#fff8c4", "#ffc107", "#3b2a00");
  activeInterval = setInterval(() => {
    createFallingItem("🏮", Math.random()*5 + 7);
  }, 1000);
}

function saveTheme(type, bg, main) {
  localStorage.setItem('themeType', type);
  applyTheme(type, bg, main);
}

function applyTheme(type, bg, main) {
  if(type === 'spring') springTheme();
  else if(type === 'snow') snowTheme();
  else if(type === 'ramadan') ramadanTheme();
  else theme(bg, main);
}

function loadAll() {
  if(localStorage.getItem('plansData')) document.getElementById('plans').innerHTML = localStorage.getItem('plansData');
  if(localStorage.getItem('doneData')) document.getElementById('doneList').innerHTML = localStorage.getItem('doneData');
  
  const savedType = localStorage.getItem('themeType') || 'snow';
  // تعيين الألوان الافتراضية لكل نوع عند التحميل
  const themes = {
    'spring': ['#e8f5e9', '#2e7d32'],
    'fire': ['#2b0b0b', '#ff5722'],
    'snow': ['#0b1f33', '#1e88e5'],
    'gold': ['#1c1c1c', '#d4af37'],
    'purple': ['#2a1437', '#8e24aa'],
    'ramadan': ['#fff8c4', '#ffc107']
  };
  applyTheme(savedType, themes[savedType][0], themes[savedType][1]);
}

/* المواد والدروس */
const subjects={
  arabic:["النصوص الأدبية","القواعد","الصرف","التعبير الكتابي","المحفوظات"],
  math:["الأعداد","المعادلات","الدوال","الإحصاء","الهندسة"],
  science:["التغذية","الهضم","التنفس","الدوران الدموي","الوراثة"],
  physics:["المادة","الكتلة والحجم","الكثافة","الكهرباء","الطاقة"],
  history:["الاحتلال","المقاومة","ثورة نوفمبر","مراحل الثورة","الاستقلال"],
  geo:["الموقع الجغرافي","السكان","الموارد","الفلاحة","الصناعة"]
};

function openSubject(name){
  show("lessons");
  const list = document.getElementById("lessonList");
  list.innerHTML="";
  subjects[name].forEach(d=>{
    list.innerHTML+=`<div class="card" onclick="this.style.background='#a5d6a7'">${d}</div>`;
  });
}
</script>

</body>
</html>
