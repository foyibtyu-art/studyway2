<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-version" content="1.0.2">
<title>Study Way 2</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f33">

<style>
:root{
  --bg:#0b1f33;
  --card:#ffffff;
  --main:#0a58ca;
  --text:#ffffff;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:var(--main);
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.title{font-size:18px}

.clock{
  text-align:center;
  font-size:28px;
  margin:15px 0;
}
.subclock{font-size:14px;opacity:.8}

.container{
  padding:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:var(--card);
  color:#000;
  border-radius:16px;
  padding:30px 10px;
  text-align:center;
  cursor:pointer;
  position:relative;
  user-select:none;
}

.page{display:none;padding:15px}

textarea,input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

button{
  background:var(--main);
  color:white;
  border:none;
}

.item{
  background:#fff;
  color:#000;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.battle{
  background:linear-gradient(135deg,#ff5722,#ff9800);
  padding:20px;
  border-radius:18px;
  margin:15px;
  text-align:center;
}

/* ===== يد أنمي (بدون تأثير على اللمس) ===== */
.anime-hand{
  position:absolute;
  right:-10px;
  bottom:-10px;
  width:40px;
  pointer-events:none; /* هذا هو المفتاح */
  animation:handTap 1.4s infinite ease-in-out;
}

@keyframes handTap{
  0%{transform:translateY(0)}
  50%{transform:translateY(6px)}
  100%{transform:translateY(0)}
}
</style>
</head>

<body>

<div class="header">
  <span onclick="home()">⬅️</span>
  <span class="title">📘 Study Way</span>
  <span onclick="settings()">⚙️</span>
</div>

<div class="clock" id="clock">
  00:00:00
  <div class="subclock" id="date"></div>
</div>

<!-- الصفحة الرئيسية -->
<div id="home" class="container">
  <div class="card" onclick="openProgram()">💻 التخطيط</div>
  <div class="card" onclick="openApp()">📱 التنفيذ</div>

  <!-- المواد (يد فقط، لا تغيير ضغط) -->
  <div class="card" onclick="openSubjects()">
    📚 المواد
    <img src="hand.png" class="anime-hand" alt="">
  </div>
</div>

<div class="battle">
  ⚔️ معركة الفصل
  <div id="countdown"></div>
</div>

<!-- التخطيط -->
<div id="program" class="page">
  <input id="planText" placeholder="اسم الخطة">
  <input type="time" id="planTime">
  <button onclick="addPlan()">إضافة</button>
  <div id="plans"></div>
</div>

<!-- التنفيذ -->
<div id="app" class="page">
  <textarea id="doneText"></textarea>
  <button onclick="addDone()">حفظ</button>
  <div id="doneList"></div>
</div>

<!-- المواد -->
<div id="subjects" class="container page">
  <div class="card" onclick="openSubject('arabic')">📘 العربية</div>
  <div class="card" onclick="openSubject('math')">🧮 الرياضيات</div>
  <div class="card" onclick="openSubject('science')">🧪 العلوم</div>
  <div class="card" onclick="openSubject('physics')">⚡ الفيزياء</div>
  <div class="card" onclick="openSubject('history')">🏛️ التاريخ</div>
  <div class="card" onclick="openSubject('geo')">🌍 الجغرافيا</div>
</div>

<!-- الدروس -->
<div id="lessons" class="container page"></div>

<!-- الإعدادات -->
<div id="settings" class="page">
  <button>🔥 ناري</button>
  <button>❄️ ثلجي</button>
  <button>🟨 ذهبي</button>
  <button>💜 بنفسجي</button>
  <button>🌙 رمضان</button>
</div>

<script>
const pages=["home","program","app","settings","subjects","lessons"];

function show(id){
  pages.forEach(p=>document.getElementById(p).style.display="none");
  document.getElementById(id).style.display=
    (id==="home"||id==="subjects"||id==="lessons")?"grid":"block";
}

function home(){show("home")}
function openProgram(){show("program")}
function openApp(){show("app")}
function settings(){show("settings")}
function openSubjects(){show("subjects")}

setInterval(()=>{
  const n=new Date();
  clock.textContent=n.toLocaleTimeString();
  date.textContent=n.toLocaleDateString("ar-DZ");
},1000);

function addPlan(){
  if(!planText.value||!planTime.value)return;
  plans.innerHTML+=`<div class="item">${planText.value}</div>`;
  planText.value="";planTime.value="";
}

function addDone(){
  if(!doneText.value)return;
  doneList.innerHTML+=`<div class="item">${doneText.value}</div>`;
  doneText.value="";
}

const lessonsData={
  arabic:["النصوص الأدبية","القواعد","الصرف","التعبير الكتابي","المحفوظات"],
  math:["الأعداد الطبيعية","الكسور","المعادلات","الهندسة","الإحصاء"],
  science:["التغذية","الهضم","التنفس","الدوران الدموي"],
  physics:["المادة","الكتلة والحجم","الكثافة","الكهرباء"],
  history:["الاحتلال الفرنسي","المقاومة","ثورة نوفمبر","الاستقلال"],
  geo:["الموقع الجغرافي","السكان","الموارد الطبيعية","الفلاحة","الصناعة"]
};

function openSubject(name){
  show("lessons");
  lessons.innerHTML="";
  lessonsData[name].forEach(l=>{
    lessons.innerHTML+=`<div class="card">📘 ${l}</div>`;
  });
}
</script>

</body>
</html>
