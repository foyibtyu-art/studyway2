<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Way 2</title>

<style>
/* ===== COLORS ===== */
body{
  margin:0;
  font-family:Arial;
  background:#0b1f33;
  color:#ffffff;
  overflow-x:hidden;
}

/* ===== HEADER ===== */
.header{
  background:#2196f3;
  padding:15px;
  text-align:center;
  font-weight:bold;
  font-size:20px;
}

/* ===== CLOCK ===== */
.clock{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:15px 0;
}
.subclock{font-size:14px;opacity:.8}

/* ===== HOME ===== */
.container{
  padding:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:#ffffff;
  color:#000;
  border-radius:20px;
  padding:30px 10px;
  text-align:center;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,.25);
  position:relative;
  z-index:100; /* مهم */
}

.wide{grid-column:1 / span 2}

/* ===== BUTTON ===== */
button{
  background:#2196f3;
  color:white;
  border:none;
  border-radius:16px;
  padding:14px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,.25);
  position:relative;
  z-index:100; /* مهم */
}

/* ===== SNOW ===== */
.snowflake{
  position:fixed;
  top:-30px;
  color:#ffffff;
  pointer-events:none; /* يخلي الأزرار تخدم */
  z-index:10; /* تحت الأزرار */
  animation:snowFall linear forwards;
}

@keyframes snowFall{
  to{
    transform:translateY(120vh);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="header">Study Way 2</div>

<div class="clock" id="clock">
  00:00:00
  <div class="subclock" id="date"></div>
</div>

<div class="container">
  <div class="card" onclick="alert('التخطيط')">💻 التخطيط</div>
  <div class="card" onclick="alert('التنفيذ')">📱 التنفيذ</div>
  <div class="card wide" onclick="alert('الملخصات')">📚 الملخصات</div>
  <div class="card wide" onclick="alert('تحدي الفصل')">⚔️ تحدي الفصل</div>
</div>

<script>
/* ===== CLOCK ===== */
function updateClock(){
  const n=new Date();
  clock.textContent=n.toLocaleTimeString();
  date.textContent=n.toLocaleDateString("ar-DZ");
}
setInterval(updateClock,1000);
updateClock();

/* ===== HEAVY SNOW ===== */
function makeSnow(){
  for(let i=0;i<5;i++){   // ❄️ ثلج كثيف جدا
    const s=document.createElement("div");
    s.className="snowflake";
    s.textContent=Math.random()>0.5?"❄":"✦";
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=8+Math.random()*18+"px";
    s.style.opacity=0.4+Math.random()*0.6;
    s.style.animationDuration=4+Math.random()*6+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),12000);
  }
}

/* كثافة عالية */
setInterval(makeSnow,120);
</script>

</body>
</html>
