<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Way 2</title>

<style>
:root{
  --bg:#0b1f33;
  --main:#1e88e5;
  --card:#ffffff;
  --text:#ffffff;
  --cardText:#000000;
}

/* ===== BASE ===== */
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  transition:.3s;
}

.header{
  background:var(--main);
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.back{cursor:pointer;font-size:22px}

/* ===== CLOCK ===== */
.clock{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:15px 0;
}
.subclock{font-size:14px;opacity:.8}

/* ===== HOME ===== */
.container{
  padding:15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:var(--card);
  color:var(--cardText);
  border-radius:18px;
  padding:30px 10px;
  text-align:center;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

.wide{grid-column:1 / span 2}

/* ===== PAGES ===== */
.page{display:none;padding:15px}

/* ===== BUTTONS ===== */
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  background:var(--main);
  color:white;
  font-size:15px;
}

/* ===== BATTLE ===== */
.battle{
  background:var(--main);
  padding:25px;
  border-radius:20px;
  text-align:center;
  margin:15px;
}
.countdown{font-size:22px;margin-top:10px}

/* ===== SNOW ===== */
.snow{
  position:fixed;
  top:-20px;
  pointer-events:none;
  z-index:9999;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh)}
}
</style>
</head>

<body>

<div class="header">
  <span class="back" onclick="show('home')">←</span>
  <span>Study Way 2</span>
  <span onclick="show('settings')">⚙️</span>
</div>

<div class="clock" id="clock">
  00:00:00
  <div class="subclock" id="date"></div>
</div>

<!-- HOME -->
<div id="home" class="container">
  <div class="card">💻 التخطيط</div>
  <div class="card">📱 التنفيذ</div>
  <div class="card wide">📚 الملخصات</div>
  <div class="card wide" onclick="show('battle')">⚔️ تحدي الفصل</div>
</div>

<!-- BATTLE -->
<div id="battle" class="page">
  <div class="battle">
    ⚔️ معركة الفصل
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="page">
  <h3>🎨 السمات</h3>
  <button onclick="setTheme('fire')">🔥 ناري</button>
  <button onclick="setTheme('ice')">❄️ ثلجي</button>
  <button onclick="setTheme('gold')">🟨 ذهبي</button>
  <button onclick="setTheme('purple')">🟣 أرجواني</button>
</div>

<script>
/* ===== NAV ===== */
const pages=["home","battle","settings"];
function show(id){
  pages.forEach(p=>document.getElementById(p).style.display="none");
  document.getElementById(id).style.display=id==="home"?"grid":"block";
}

/* ===== CLOCK ===== */
function updateClock(){
  const n=new Date();
  clock.textContent=n.toLocaleTimeString();
  date.textContent=n.toLocaleDateString("ar-DZ");
}
setInterval(updateClock,1000);updateClock();

/* ===== COUNTDOWN ===== */
function updateCountdown(){
  const now=new Date();
  let target=new Date(now.getFullYear(),0,7);
  if(now>target) target=new Date(now.getFullYear()+1,0,7);
  countdown.textContent=Math.floor((target-now)/86400000)+" يوم";
}
setInterval(updateCountdown,1000);updateCountdown();

/* ===== THEMES ===== */
let snowInt=null;

function setTheme(t){
  clearInterval(snowInt);
  document.querySelectorAll(".snow").forEach(e=>e.remove());

  if(t==="fire")
    apply("#2b0b0b","#ff5722","#3b0d0d","#ffd6c9","#ffd6c9");

  if(t==="ice"){
    apply("#0b1f33","#1e88e5","#e3f2fd","#003344","#000");
    snowInt=setInterval(makeSnow,200);
  }

  if(t==="gold")
    apply("#1c1c1c","#d4af37","#2b2400","#ffdd66","#ffdd66");

  if(t==="purple")
    apply("#2a083d","#7b1fa2","#ede7f6","#e6b3ff","#000");

  localStorage.setItem("theme",t);
}

function apply(bg,main,card,text,cardText){
  const r=document.documentElement.style;
  r.setProperty("--bg",bg);
  r.setProperty("--main",main);
  r.setProperty("--card",card);
  r.setProperty("--text",text);
  r.setProperty("--cardText",cardText);
}

/* ===== LOAD THEME ===== */
window.onload=()=>{
  const t=localStorage.getItem("theme");
  if(t) setTheme(t);
}

/* ===== SNOW ===== */
function makeSnow(){
  const s=document.createElement("div");
  s.className="snow";
  s.textContent=Math.random()>0.5?"❄":"✦";
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=10+Math.random()*14+"px";
  s.style.opacity=Math.random();
  s.style.animationDuration=3+Math.random()*5+"s";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),9000);
}
</script>

</body>
</html>
